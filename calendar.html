<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Rehan Public School</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">R</div>
        <div class="sidebar-brand"><h2>Rehan Public School</h2><span>Management System</span></div>
      </div>
      <nav class="sidebar-nav"></nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.closeSidebar()"></div>
    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="menu-toggle" onclick="App.toggleSidebar()" aria-label="Toggle menu">☰</button>
          <h1 class="page-title" id="pageTitle" data-set="true">Calendar</h1>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearch" placeholder="Search..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="navbar-right">
          <button class="nav-btn" onclick="App.toggleTheme()" title="Dark Mode">🌓</button>
          <button class="nav-btn" onclick="window.location='notifications.html'" title="Notifications">🔔<span class="badge-count" id="notifBadge" style="display:none">0</span></button>
          <button class="nav-btn" onclick="window.location='communication.html'" title="Messages">✉️</button>
          <div class="user-menu" onclick="App.toggleUserMenu()">
            <div class="user-avatar" id="navUserAvatar">A</div>
            <div class="user-info"><div class="user-name" id="navUserName">User</div><div class="user-role" id="navUserRole">admin</div></div>
            <div class="dropdown-menu" id="userDropdown">
              <a href="profile.html">👤 Profile</a>
              <a href="settings.html">⚙️ Settings</a>
              <div class="divider"></div>
              <button onclick="Auth.logout()">🚪 Logout</button>
            </div>
          </div>
        </div>
      </header>
      <div class="page-content">

        <div class="page-header"><div><h1>School Calendar</h1></div>
          <div class="page-actions"><button class="btn btn-secondary" onclick="CalendarModule.prevMonth()">‹ Prev</button>
          <span id="calMonth" style="font-weight:600;padding:0 1rem"></span>
          <button class="btn btn-secondary" onclick="CalendarModule.nextMonth()">Next ›</button>
          <button class="btn btn-primary" onclick="CalendarModule.openAdd()">+ Add Event</button></div>
        </div>
        <div class="card"><div class="card-body" style="padding:0"><div class="calendar-grid" id="calendarGrid"></div></div></div>
        <div class="modal-overlay" id="formModal"><div class="modal"><div class="modal-header"><h3>Add Event</h3><button class="modal-close" onclick="App.closeModal('formModal')">&times;</button></div>
        <div class="modal-body"><form id="dataForm">
          <div class="form-group"><label>Title *</label><input type="text" class="form-control" id="f_title" required></div>
          <div class="form-row"><div class="form-group"><label>Date</label><input type="date" class="form-control" id="f_date"></div>
          <div class="form-group"><label>Type</label><select class="form-control" id="f_type"><option>Activities</option><option>Holidays</option><option>Exams</option><option>Sports Day</option><option>Parent Meeting</option><option>Annual Function</option></select></div></div>
          <div class="form-group"><label>Description</label><textarea class="form-control" id="f_description"></textarea></div>
          <div class="form-group"><label>Location</label><input type="text" class="form-control" id="f_location"></div>
        </form></div>
        <div class="modal-footer"><button class="btn btn-secondary" onclick="App.closeModal('formModal')">Cancel</button><button class="btn btn-primary" onclick="CalendarModule.save()">Save</button></div></div></div>

      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) {}
    if (!Auth.hasAccess('calendar') && Auth.getRole() !== 'admin') { window.location.href = 'dashboard.html'; }
    document.addEventListener('DOMContentLoaded', () => { App.init(); });
  </script>
  <script src="js/calendar.js"></script>
  
</body>
</html>
