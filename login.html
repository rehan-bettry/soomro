<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Rehan Public School</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-left">
      <div class="login-left-content">
        <div class="login-logo">R</div>
        <h1>Rehan Public School</h1>
        <p>Learn Today. Build Tomorrow.<br>Access your school management portal to manage academics, attendance, fees, and more.</p>
      </div>
    </div>
    <div class="login-right">
      <div class="login-form-wrapper">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account to continue</p>
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email">Username / Email</label>
            <input type="text" class="form-control" id="email" placeholder="Enter your email" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <div class="form-options">
            <label class="form-check"><input type="checkbox" id="remember"> Remember Me</label>
            <a href="#" onclick="alert('Please contact the school administrator to reset your password.');return false;">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Login</button>
          <div id="loginError" style="color:var(--danger);font-size:0.85rem;margin-top:0.75rem;display:none;text-align:center"></div>
        </form>
        <div class="demo-accounts">
          <h4>Demo Accounts</h4>
          <div class="demo-btns">
            <button type="button" onclick="fillDemo('admin@rehan-school.com','admin123')">Admin</button>
            <button type="button" onclick="fillDemo('teacher@rehan-school.com','teacher123')">Teacher</button>
            <button type="button" onclick="fillDemo('student@rehan-school.com','student123')">Student</button>
            <button type="button" onclick="fillDemo('parent@rehan-school.com','parent123')">Parent</button>
          </div>
        </div>
        <p style="text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--text-muted)">
          <a href="index.html">← Back to Website</a>
        </p>
      </div>
    </div>
  </div>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';
    const remembered = localStorage.getItem('remember_email');
    if (remembered) { document.getElementById('email').value = remembered; document.getElementById('remember').checked = true; }
    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const result = Auth.login(email, password, remember);
      const errEl = document.getElementById('loginError');
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        errEl.textContent = result.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
