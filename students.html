<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Rehan Public School</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">R</div>
        <div class="sidebar-brand"><h2>Rehan Public School</h2><span>Management System</span></div>
      </div>
      <nav class="sidebar-nav"></nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.closeSidebar()"></div>
    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="menu-toggle" onclick="App.toggleSidebar()" aria-label="Toggle menu">☰</button>
          <h1 class="page-title" id="pageTitle" data-set="true">Students</h1>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearch" placeholder="Search..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="navbar-right">
          <button class="nav-btn" onclick="App.toggleTheme()" title="Dark Mode">🌓</button>
          <button class="nav-btn" onclick="window.location='notifications.html'" title="Notifications">🔔<span class="badge-count" id="notifBadge" style="display:none">0</span></button>
          <button class="nav-btn" onclick="window.location='communication.html'" title="Messages">✉️</button>
          <div class="user-menu" onclick="App.toggleUserMenu()">
            <div class="user-avatar" id="navUserAvatar">A</div>
            <div class="user-info"><div class="user-name" id="navUserName">User</div><div class="user-role" id="navUserRole">admin</div></div>
            <div class="dropdown-menu" id="userDropdown">
              <a href="profile.html">👤 Profile</a>
              <a href="settings.html">⚙️ Settings</a>
              <div class="divider"></div>
              <button onclick="Auth.logout()">🚪 Logout</button>
            </div>
          </div>
        </div>
      </header>
      <div class="page-content">

        <div class="page-header">
          <div><h1>Students</h1><div class="breadcrumb">Manage student records</div></div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="Students.openAdd()">+ Add Student</button>
          </div>
        </div>
        <div class="toolbar">
          <input type="text" class="form-control search-input" id="searchInput" placeholder="Search by name, ID, admission no..." oninput="Students.search(this.value)">
          <select class="form-control" id="filterClass" onchange="Students.filter()"><option value="">All Classes</option></select>
          <select class="form-control" id="filterStatus" onchange="Students.filter()">
            <option value="">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="card">
          <div class="card-body" style="padding:0">
            <div class="table-wrapper">
              <table class="table">
                <thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Roll</th><th>Gender</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
          <div class="card-footer"><div class="pagination" id="pagination"></div></div>
        </div>
        <div class="modal-overlay" id="formModal">
          <div class="modal modal-lg">
            <div class="modal-header"><h3 id="modalTitle">Add Student</h3><button class="modal-close" onclick="App.closeModal('formModal')">&times;</button></div>
            <div class="modal-body">
              <form id="dataForm">
                <input type="hidden" id="editId">
                <div class="form-row">
                  <div class="form-group"><label>Full Name *</label><input type="text" class="form-control" id="f_name" required></div>
                  <div class="form-group"><label>Admission No</label><input type="text" class="form-control" id="f_admissionNo"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Father Name</label><input type="text" class="form-control" id="f_fatherName"></div>
                  <div class="form-group"><label>Mother Name</label><input type="text" class="form-control" id="f_motherName"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Date of Birth</label><input type="date" class="form-control" id="f_dob"></div>
                  <div class="form-group"><label>Gender</label><select class="form-control" id="f_gender"><option>Male</option><option>Female</option></select></div>
                  <div class="form-group"><label>Blood Group</label><select class="form-control" id="f_bloodGroup"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Class *</label><select class="form-control" id="f_class" required></select></div>
                  <div class="form-group"><label>Section</label><input type="text" class="form-control" id="f_section" value="A"></div>
                  <div class="form-group"><label>Roll Number</label><input type="number" class="form-control" id="f_rollNo"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Phone</label><input type="tel" class="form-control" id="f_phone"></div>
                  <div class="form-group"><label>Email</label><input type="email" class="form-control" id="f_email"></div>
                </div>
                <div class="form-group"><label>Address</label><textarea class="form-control" id="f_address"></textarea></div>
                <div class="form-row">
                  <div class="form-group"><label>Guardian</label><input type="text" class="form-control" id="f_guardian"></div>
                  <div class="form-group"><label>Guardian Phone</label><input type="tel" class="form-control" id="f_guardianPhone"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Admission Date</label><input type="date" class="form-control" id="f_admissionDate"></div>
                  <div class="form-group"><label>Previous School</label><input type="text" class="form-control" id="f_previousSchool"></div>
                  <div class="form-group"><label>Status</label><select class="form-control" id="f_status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="App.closeModal('formModal')">Cancel</button>
              <button class="btn btn-primary" onclick="Students.save()">Save Student</button>
            </div>
          </div>
        </div>
        <div class="modal-overlay" id="viewModal">
          <div class="modal modal-lg">
            <div class="modal-header"><h3>Student Profile</h3><button class="modal-close" onclick="App.closeModal('viewModal')">&times;</button></div>
            <div class="modal-body" id="viewBody"></div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="App.closeModal('viewModal')">Close</button>
              <button class="btn btn-primary" onclick="window.print()">Print Profile</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) {}
    if (!Auth.hasAccess('students') && Auth.getRole() !== 'admin') { window.location.href = 'dashboard.html'; }
    document.addEventListener('DOMContentLoaded', () => { App.init(); });
  </script>
  <script src="js/students.js"></script>
  
</body>
</html>
