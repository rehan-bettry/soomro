<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance — Rehan Public School</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">R</div>
        <div class="sidebar-brand"><h2>Rehan Public School</h2><span>Management System</span></div>
      </div>
      <nav class="sidebar-nav"></nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.closeSidebar()"></div>
    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="menu-toggle" onclick="App.toggleSidebar()" aria-label="Toggle menu">☰</button>
          <h1 class="page-title" id="pageTitle" data-set="true">Finance</h1>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearch" placeholder="Search..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="navbar-right">
          <button class="nav-btn" onclick="App.toggleTheme()" title="Dark Mode">🌓</button>
          <button class="nav-btn" onclick="window.location='notifications.html'" title="Notifications">🔔<span class="badge-count" id="notifBadge" style="display:none">0</span></button>
          <button class="nav-btn" onclick="window.location='communication.html'" title="Messages">✉️</button>
          <div class="user-menu" onclick="App.toggleUserMenu()">
            <div class="user-avatar" id="navUserAvatar">A</div>
            <div class="user-info"><div class="user-name" id="navUserName">User</div><div class="user-role" id="navUserRole">admin</div></div>
            <div class="dropdown-menu" id="userDropdown">
              <a href="profile.html">👤 Profile</a>
              <a href="settings.html">⚙️ Settings</a>
              <div class="divider"></div>
              <button onclick="Auth.logout()">🚪 Logout</button>
            </div>
          </div>
        </div>
      </header>
      <div class="page-content">

        <div class="page-header"><div><h1>Finance Dashboard</h1></div></div>
        <div class="grid grid-4" style="margin-bottom:1.5rem" id="financeStats"></div>
        <div class="grid grid-2"><div class="card"><div class="card-header"><h3>Income vs Expenses</h3></div><div class="card-body"><div class="chart-container"><canvas id="financeChart"></canvas></div></div></div>
        <div class="card"><div class="card-header"><h3>Fee Collection Summary</h3></div><div class="card-body"><div class="chart-container"><canvas id="feeChart"></canvas></div></div></div></div>

      </div>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) {}
    if (!Auth.hasAccess('finance') && Auth.getRole() !== 'admin') { window.location.href = 'dashboard.html'; }
    document.addEventListener('DOMContentLoaded', () => { App.init(); });
  </script>
  <script src="js/finance.js"></script>
  
</body>
</html>
